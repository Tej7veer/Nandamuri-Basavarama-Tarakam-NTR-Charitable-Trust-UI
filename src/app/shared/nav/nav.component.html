<header class="site-nav">

  <!-- Branding -->
  <div class="brand-section">
    <div class="brand-decoration left"></div>

    <a class="brand" routerLink="/" aria-label="Nandamuri Basavarama Tarakam NTR Charitable Trust">
      <img
        class="brand-logo"
        src="assets/logo.jpeg"
        alt="Nandamuri Basavarama Tarakam NTR Charitable Trust logo"
      />

      <span class="brand-name">
        Nandamuri Basavarama Tarakam NTR Charitable Trust
      </span>
    </a>

    <div class="brand-decoration right"></div>
  </div>

  <!-- Navigation -->
  <div class="navigation-section">
    <div class="navigation-container">

      <nav class="nav-links" aria-label="Main navigation">

        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
          Home
        </a>

        <a routerLink="/about" routerLinkActive="active">
          About
        </a>

        <a routerLink="/programs" routerLinkActive="active">
          Programs
        </a>

        <a routerLink="/projects" routerLinkActive="active">
          Projects &amp; Events
        </a>

        <a routerLink="/gallery" routerLinkActive="active">
          Gallery
        </a>

        <a routerLink="/volunteer" routerLinkActive="active">
          Volunteer
        </a>

        <a routerLink="/contact" routerLinkActive="active">
          Contact
        </a>

      </nav>

      <div class="nav-actions">

        <a
          class="donate-button"
          routerLink="/donate">
          Donate
        </a>

        <a
          class="instagram-link"
          href="https://www.instagram.com/nbrtntrcharitabletrust/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8">

            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle
              cx="17.3"
              cy="6.7"
              r="1.1"
              fill="currentColor"
              stroke="none">
            </circle>

          </svg>

        </a>

      </div>

    </div>
  </div>

</header>
