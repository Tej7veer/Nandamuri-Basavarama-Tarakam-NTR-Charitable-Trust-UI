<header class="site-nav">
  <div class="navigation-container">
    <a class="brand" routerLink="/" aria-label="Nandamuri Basavarama Tarakam NTR Charitable Trust">
      <img class="brand-logo" src="assets/logo.jpeg" alt="Nandamuri Basavarama Tarakam NTR Charitable Trust logo" />
      <span class="brand-name">Nandamuri Basavarama Tarakam<br />NTR Charitable Trust</span>
    </a>

    <nav class="nav-links" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/about" routerLinkActive="active">About Us</a>
      <a routerLink="/donate" routerLinkActive="active">Donate</a>
      <a routerLink="/gallery" routerLinkActive="active">Gallery</a>
      <a routerLink="/projects" routerLinkActive="active">Events</a>
      <a routerLink="/contact" routerLinkActive="active">Contact Us</a>
    </nav>

    <a class="donate-button" routerLink="/donate">Donate Now</a>

    <button class="mobile-menu" type="button" aria-label="Open navigation" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen">
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav class="mobile-nav" [class.open]="menuOpen" aria-label="Mobile navigation">
    <a routerLink="/" (click)="closeMenu()">Home</a>
    <a routerLink="/about" (click)="closeMenu()">About Us</a>
    <a routerLink="/donate" (click)="closeMenu()">Donate</a>
    <a routerLink="/gallery" (click)="closeMenu()">Gallery</a>
    <a routerLink="/projects" (click)="closeMenu()">Events</a>
    <a routerLink="/contact" (click)="closeMenu()">Contact Us</a>
  </nav>
</header>
